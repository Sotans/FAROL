# Verificação automática: a cada envio e a cada pull request, instala o projeto do zero
# e roda lint, tipos e testes. Se algo quebrar, o GitHub avisa antes de o problema se acumular.
name: Verificação

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test -- --ci
